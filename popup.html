<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 350px;
      padding: 14px;
      margin: 0;
      background: #fdfdfd;
      color: #222;
    }
    h3 { margin: 0 0 10px 0; font-size: 15px; }
    label { font-size: 11px; font-weight: bold; display: block; margin: 8px 0 3px 0; }
    input[type="password"], textarea {
      width: 100%; box-sizing: border-box; padding: 7px; font-size: 11px;
      border: 1px solid #ccc; border-radius: 4px;
    }
    .tabs { display: flex; gap: 4px; margin-top: 10px; border-bottom: 1px solid #ccc; }
    .tab-btn {
      flex: 1; padding: 6px; font-size: 11px; cursor: pointer; background: #eee;
      border: none; border-top-left-radius: 4px; border-top-right-radius: 4px;
    }
    .tab-btn.active { background: #0066cc; color: #fff; font-weight: bold; }
    .tab-content { padding-top: 8px; }
    button.action-btn {
      width: 100%; margin-top: 8px; padding: 8px; color: white;
      border: none; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 11px;
    }
    #submit-key-btn { background: #495057; margin-top: 5px; }
    #save-ai-btn { background: #0066cc; }
    #save-json-btn { background: #6f42c1; }
    #autofill-btn { background: #28a745; margin-top: 12px; }
    #status {
      margin-top: 8px; font-size: 11px; color: #555;
      line-height: 1.3; min-height: 18px; word-break: break-word;
    }
  </style>
</head>
<body>
  <h3>AI Autofill Assistant</h3>

  <!-- API Key Entry & Submit -->
  <label for="apiKey">Enter Active Gemini API Key</label>
  <input type="password" id="apiKey" placeholder="Paste current API key here">
  <button class="action-btn" id="submit-key-btn">Submit / Update Active Key</button>

  <div class="tabs">
    <button class="tab-btn active" id="btn-tab-raw">Resume Text</button>
    <button class="tab-btn" id="btn-tab-json">Direct JSON</button>
  </div>

  <!-- Tab 1: AI Parse -->
  <div id="tab-raw" class="tab-content">
    <label for="resumeText">Paste Profile / Resume Details</label>
    <textarea id="resumeText" rows="5" placeholder="Paste resume details..."></textarea>
    <button class="action-btn" id="save-ai-btn">Parse & Save with AI</button>
  </div>

  <!-- Tab 2: Manual JSON Editor -->
  <div id="tab-json" class="tab-content" style="display: none;">
    <label for="jsonEditor">Stored Profile (JSON)</label>
    <textarea id="jsonEditor" rows="7" style="font-family: monospace;"></textarea>
    <button class="action-btn" id="save-json-btn">Save JSON Directly</button>
  </div>

  <button class="action-btn" id="autofill-btn">⚡ Autofill Current Page</button>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
